<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>小舟 · 个人网页</title>
<!--
  ============================================================
  个人网页 · 动效版 · 样板页
  ------------------------------------------------------------
  · 这是「个人网页 · 动效版」¥49 这一档的实例
  · 改内容：搜索「改成」三个字
  · 换配色：改 :root 里的 --accent 一处
  · 背景是纯 CSS 动画，没有任何视频或外部文件
  ============================================================
-->
<style>
  :root{
    --accent:#ffffff;          /* ← 改这一行换强调色 */
    --bg:#000000;
    --fg:#ffffff;
    --card:#0a0a0a;
    --rule:rgba(255,255,255,.40);
    --muted:rgba(255,255,255,.70);
    --soft:rgba(255,255,255,.90);
    --font:"Readex Pro","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
    -webkit-font-smoothing:antialiased;
  }
  .hero{position:relative;height:100vh;width:100%;overflow:hidden;background:var(--bg);}

  /* ── 背景：两层缓慢漂移的光晕 + 极淡网格（纯 CSS，无视频）── */
  .bg{position:absolute;inset:0;overflow:hidden;}
  .glow{position:absolute;width:58vmax;height:58vmax;border-radius:50%;filter:blur(90px);}
  .glow-a{
    top:-22vmax;left:-12vmax;opacity:.55;
    background:radial-gradient(circle,rgba(255,255,255,.16),transparent 66%);
    animation:drift-a 26s ease-in-out infinite alternate;
  }
  .glow-b{
    right:-16vmax;bottom:-26vmax;opacity:.42;
    background:radial-gradient(circle,rgba(255,255,255,.11),transparent 66%);
    animation:drift-b 34s ease-in-out infinite alternate;
  }
  @keyframes drift-a{
    from{transform:translate3d(0,0,0) scale(1);}
    to{transform:translate3d(6vmax,4vmax,0) scale(1.12);}
  }
  @keyframes drift-b{
    from{transform:translate3d(0,0,0) scale(1.06);}
    to{transform:translate3d(-5vmax,-5vmax,0) scale(.94);}
  }
  .grid{
    position:absolute;inset:-20%;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:76px 76px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 78%);
    animation:drift-grid 40s linear infinite alternate;
  }
  @keyframes drift-grid{
    from{transform:translate3d(0,0,0);}
    to{transform:translate3d(-76px,-38px,0);}
  }

  /* ── 漂浮胶囊导航 ── */
  .nav{
    position:absolute;top:0;left:0;right:0;z-index:20;
    padding:24px 24px 0;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:rgba(10,10,10,.90);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:999px;color:var(--fg);
  }
  .pill-brand{padding:12px 22px 12px 16px;font-size:14px;letter-spacing:-.01em;}
  .pill-brand svg{width:20px;height:20px;display:block;fill:var(--accent);}
  .pill-cta{padding:12px 24px;font-size:14px;transition:background .18s ease;background:var(--accent);color:#000;}
  .pill-cta:hover{background:rgba(255,255,255,.82);}
  .pill-brand:hover{background:rgba(26,26,26,.95);}

  /* ── 前景：错落大字 + 简介 + 三个角落链接 ── */
  .stage{position:relative;height:100%;width:100%;}
  .hero-title{letter-spacing:-.04em;line-height:0.95;}

  .word{
    position:absolute;margin:0;color:var(--fg);font-weight:500;
    /* 用 clamp 封顶：不同设备的中文字体宽度不同，不封顶会溢出屏幕 */
    font-size:clamp(52px,12vw,160px);
  }
  .w1{left:4vw;top:18%;}
  .w2{right:4vw;top:38%;}
  .w3{left:16%;top:58%;}

  .bio{
    position:absolute;left:4vw;top:46%;max-width:min(240px,62vw);margin:0;
    font-size:15px;line-height:1.35;color:var(--soft);
  }

  /* 三个角落链接块：斜线分隔 + 文字，替换原版的数据块 */
  .slot{
    position:absolute;display:flex;align-items:center;gap:12px;
    text-decoration:none;color:var(--fg);
  }
  .slot:hover .slot-text b{text-decoration:underline;text-underline-offset:5px;}
  .slot:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:6px;}
  .slot-text{display:flex;flex-direction:column;line-height:1.3;}
  .slot-text b{font-size:15px;font-weight:500;}
  .slot-text i{font-style:normal;font-size:12px;color:var(--muted);}
  .rule{display:none;height:1px;width:96px;background:var(--rule);flex:none;}

  .slot-tr{right:24px;top:14%;justify-content:flex-end;}
  .slot-tr .rule{transform:rotate(20deg);}
  .slot-bl{left:24px;bottom:80px;}
  .slot-bl .rule{transform:rotate(-20deg);}
  .slot-br{right:24px;bottom:64px;justify-content:flex-end;}
  .slot-br .rule{transform:rotate(-20deg);}

  /* 底部渐变遮罩 */
  .fade{
    pointer-events:none;position:absolute;left:0;right:0;bottom:0;height:12rem;
    background:linear-gradient(to bottom,transparent,#000);
  }

  @media (min-width:768px){
    .nav{padding:24px 40px 0;}
    .word{font-size:clamp(52px,12vw,160px);}
    .w1{left:2.8vw;}
    .w2{right:2.8vw;}
    .w3{left:26%;}
    .bio{left:2.8vw;}
    .rule{display:block;}
    .slot-tr{right:96px;}
    .slot-bl{left:80px;bottom:96px;}
    .slot-br{right:80px;bottom:80px;}
  }

  /* 手机窄屏：大字略小，角落块内收 */
  @media (max-width:400px){
    .bio{max-width:min(200px,58vw);font-size:14px;}
    .slot-text b{font-size:14px;}
  }

  @media (prefers-reduced-motion:reduce){
    .glow-a,.glow-b,.grid{animation:none !important;}
  }
</style>
</head>
<body>
  <section class="hero" aria-label="小舟的个人网页">
    <div class="bg" aria-hidden="true">
      <span class="glow glow-a"></span>
      <span class="glow glow-b"></span>
      <span class="grid"></span>
    </div>

    <nav class="nav" aria-label="页面导航">
      <a class="pill pill-brand" href="../index.html">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 128 L 64 128 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z M 128 64 L 128 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 Z M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 128 0 L 192 0 Z"/></svg>
        <!-- 改成：你的名字 -->
        <span>小舟</span>
      </a>
      <!-- 改成：联系方式 -->
      <a class="pill pill-cta" href="mailto:hi@example.com">联系我</a>
    </nav>

    <div class="stage">
      <!-- 改成：三句自我介绍，从左上到右下像一句话读下来 -->
      <h1 class="hero-title word w1">你好</h1>
      <h1 class="hero-title word w2">我是</h1>
      <h1 class="hero-title word w3">小舟</h1>

      <!-- 改成：一句话简介 -->
      <p class="bio">在读学生 · 喜欢做小工具和整理笔记</p>

      <!-- 改成：三个链接，分别固定在右上 / 左下 / 右下 -->
      <a class="slot slot-tr" href="../../index.html">
        <span class="rule" aria-hidden="true"></span>
        <span class="slot-text"><b>我的作品集</b><i>ai-lab</i></span>
      </a>

      <a class="slot slot-bl" href="#">
        <span class="slot-text"><b>小红书</b><i>@xiaozhou</i></span>
        <span class="rule" aria-hidden="true"></span>
      </a>

      <a class="slot slot-br" href="mailto:hi@example.com">
        <span class="rule" aria-hidden="true"></span>
        <span class="slot-text"><b>邮箱</b><i>hi@example.com</i></span>
      </a>
    </div>

    <div class="fade" aria-hidden="true"></div>
  </section>
</body>
</html>
